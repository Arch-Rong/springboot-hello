spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # Keep update for this sample because it has no migration scripts yet.
      # Switch to validate after introducing Flyway/Liquibase migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
