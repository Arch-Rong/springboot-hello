# 使用方式：SPRING_PROFILES_ACTIVE=prod
# 未设置环境变量时，默认连本机 Docker Postgres（127.0.0.1:5433）
spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/springboot_hello}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:hello_local_only}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      # 本示例暂无迁移脚本，默认 update；接入 Flyway/Liquibase 后建议改为 validate
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
