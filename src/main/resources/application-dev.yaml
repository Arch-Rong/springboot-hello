# 本地默认连 Docker Postgres（端口 5433，见 docker-compose.yml）
# 启动前：docker compose up -d
spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/springboot_hello}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:hello_local_only}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
